name: Test Curl Miniconda

env:
  # For Chicago time on log messages:
  TZ: America/Chicago
  # Setting to avoid MPID_Init() issues with MANA
  #         on GitHub Azure system:
  #         From Claude: 2026-10-04:
  UCX_TLS: sm,self

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: >-
      OS=${{ contains(matrix.os, 'ubuntu') && 'Ubuntu' || 'Mac' }}
      PY=${{ matrix.python-version }}
      LBL=${{ matrix.miniconda-label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-14  #  This is ARM64
        # There is no free mac-14 for x86 on GitHub

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

        miniconda-label:
          - OLD
          - MID
          - NEW
          - NOW

    steps:
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Download Miniconda script
        run: |
          curl -LOsS https://raw.githubusercontent.com/emews/emews-tutorial/main/gh/download-miniconda.sh
      # The script always writes proceed=true or proceed=false.
      # NOW writes proceed=false when the latest Miniconda's Python is
      # not this job's Python: later steps are skipped, and the job
      # passes.  Otherwise it writes proceed=true and the steps run.
      - name: Install Miniconda
        id: miniconda
        run: |
          zsh download-miniconda.sh -i ${{ matrix.python-version }} \
            $HOME/miniconda ${{ matrix.miniconda-label }}
      - name: Check environment
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          echo "hostname:" $(hostname)
          echo "whoami:  " $(whoami)
          echo "date:    " $(date "+%Y-%m-%d %H:%M")
          echo "pwd:     " $(pwd -P)
          # Conda has not been activated-
          #       this will change in install_emews.sh
          echo "python:  " $(which python)
          echo
      - name: Download scripts
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          curl -LOsS https://raw.githubusercontent.com/emews/emews-tutorial/main/code/install/install_emews.sh
          curl -LOsS https://raw.githubusercontent.com/emews/emews-tutorial/main/code/install/install_list.R
          # -L : location redirect
          # -O : remote-name
          # -s : silent
          # -S : show-error
      - name: Set up GitHub PAT
        if: steps.miniconda.outputs.proceed == 'true'
        # Set up PAT for R install_github()
        run: |
          echo "GITHUB_PAT=${{ secrets.GH_PAT_WOZ }}" >> ~/.Renviron
      - name: Install EMEWS
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          bash install_emews.sh ${{ matrix.python-version }} $PWD/DB
      - name: Show log
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          cat emews_install.log
      - name: Inspect installation
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          # Look for SUCCESS in log:
          grep "INSTALL SUCCESS." emews_install.log

      # gh-run tests ...
      # gh-run is created by install_emews.sh
      - name: "Runtime test: gh-run sanity"
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          ./gh-run echo gh-run works
      - name: "Runtime test: swift-t version info"
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          ./gh-run swift-t -v
      - name: "Runtime test: swift-t sanity"
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          ./gh-run swift-t -E 'trace("SUCCESS SWIFT/T");'
      - name: "Runtime test: swift-t include EQ/R"
        if: steps.miniconda.outputs.proceed == 'true'
        run: |
          ./gh-run swift-t -i EQR -E 'trace("SUCCESS EQ/R   ");'


# TODO: Needs -I $CONDA_PREFIX/lib

# We do not test everything here because we don't have a full clone.
# See ./test-clone.yaml for the Swift/T tests.
